<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLMake</title>
<link rel="stylesheet" href="/vendor/katex.min.css">
<style>
:root {
  --bg: #fafafa; --panel: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
  --border: #e2e2e2; --accent: #2f6f4f; --danger: #b3261e;
  --editor-bg: #202124; --editor-text: #e8eaed; --preview-bg: #ffffff;
  --radius: 6px; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --editor-font-size: 14px;
}
[data-theme="dark"] {
  --bg: #141414; --panel: #1e1e1e; --text: #e6e6e6; --muted: #9a9a9a;
  --border: #333; --accent: #6fbf8f; --preview-bg: #232323;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: var(--radius); padding: var(--space-1) var(--space-3); cursor: pointer; }
button.danger { color: var(--danger); }
input, textarea { font: inherit; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-1) var(--space-2); background: var(--panel); color: var(--text); }
header { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header .spacer { flex: 1; }
#main { display: flex; height: calc(100vh - 49px); }
#sidebar { width: 260px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
#sidebar .tools { padding: var(--space-2); display: flex; gap: var(--space-1); flex-wrap: wrap; border-bottom: 1px solid var(--border); }
#doclist { overflow: auto; flex: 1; }
#doclist button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: var(--space-2) var(--space-3); }
#doclist button.active { background: var(--bg); font-weight: 600; }
#work { flex: 1; display: flex; min-width: 0; }
#editorPane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#editorHost { flex: 1; overflow: auto; background: var(--editor-bg); font-size: var(--editor-font-size); }
#editorHost .cm-editor { height: 100%; background: var(--editor-bg); color: var(--editor-text); }
#status { padding: var(--space-1) var(--space-3); font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--panel); }
#previewPane { flex: 1; overflow: auto; background: var(--preview-bg); padding: var(--space-4); border-left: 1px solid var(--border); }
#auth { max-width: 360px; margin: 10vh auto; padding: var(--space-4); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; gap: var(--space-2); }
.menu { position: relative; }
.menu > div { position: absolute; right: 0; top: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); display: none; min-width: 200px; z-index: 10; }
.menu.open > div { display: block; }
.menu > div button { display: block; width: 100%; border: 0; border-radius: 0; text-align: left; }
pre { background: var(--bg); padding: var(--space-2); overflow: auto; border-radius: var(--radius); }
code { background: var(--bg); border-radius: 3px; padding: 0 4px; }
table { border-collapse: collapse; } td, th { border: 1px solid var(--border); padding: 2px 8px; }
blockquote { border-left: 3px solid var(--border); margin: 0; padding-left: var(--space-3); color: var(--muted); }
#conflict { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
#conflict > div { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); width: min(1100px, 94vw); max-height: 86vh; display: flex; flex-direction: column; padding: var(--space-3); gap: var(--space-2); }
#conflict .cols { display: flex; gap: var(--space-2); flex: 1; min-height: 0; }
#conflict pre { flex: 1; overflow: auto; white-space: pre-wrap; }
#conflict .bar { display: flex; gap: var(--space-2); flex-wrap: wrap; }
@media (max-width: 900px) { #sidebar { display: none; } #sidebar.show { display: flex; position: fixed; inset: 49px 0 0 0; width: 100%; z-index: 5; } #work { flex-direction: column; } #previewPane { border-left: 0; border-top: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1>GLMake</h1>
  <button id="btnMenuToggle" hidden>文档</button>
  <span class="spacer"></span>
  <div class="menu" id="sysMenu">
    <button aria-haspopup="true">系统菜单</button>
    <div>
      <button data-act="sync">立即同步（Ctrl+S）</button>
      <button data-act="autosync">自动同步：每 10 分钟（开/关）</button>
      <button data-act="versions">版本历史</button>
      <button data-act="export">导出 Markdown</button>
      <button data-act="export-html">导出 HTML</button>
      <button data-act="export-pdf">导出 PDF（打印）</button>
      <button data-act="export-all">全量导出（.glmake.zip）</button>
      <button data-act="theme">主题：light/dark/系统</button>
      <button data-act="font-up">字号 +</button>
      <button data-act="font-down">字号 −</button>
      <button data-act="share">创建只读分享链接</button>
      <button data-act="trash">回收站</button>
      <button data-act="logout">退出登录</button>
      <button data-act="logoutall" class="danger">退出所有设备</button>
    </div>
  </div>
</header>
<div id="auth" hidden>
  <h2>登录</h2>
  <input id="authUser" placeholder="用户名" autocomplete="username">
  <input id="authPass" type="password" placeholder="密码" autocomplete="current-password">
  <button id="authSubmit">登录</button>
  <p id="authMsg" style="color:var(--danger);min-height:1.2em"></p>
</div>
<div id="main" hidden>
  <nav id="sidebar" aria-label="文档管理">
    <div class="tools">
      <button id="btnNew">新建</button>
      <input id="search" placeholder="搜索（≥3 字符）" style="flex:1;min-width:80px">
    </div>
    <div id="doclist"></div>
  </nav>
  <div id="work">
    <div id="editorPane">
      <div id="editorHost" aria-label="Markdown 编辑区"></div>
      <div id="status">就绪</div>
    </div>
    <section id="previewPane" aria-label="预览"></section>
  </div>
</div>
<div id="versions" hidden role="dialog" aria-modal="true" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;padding:var(--space-3);gap:var(--space-2)">
    <h3>版本历史（每篇最多 10 个 / 30 天）</h3>
    <div id="verList" style="overflow:auto;flex:1"></div>
    <div><button id="verClose">关闭</button></div>
  </div>
</div>
<div id="conflict" hidden role="dialog" aria-modal="true">
  <div>
    <h3 id="cfTitle">冲突</h3>
    <div class="cols">
      <pre id="cfLocal" aria-label="本地版"></pre>
      <pre id="cfServer" aria-label="云端版"></pre>
    </div>
    <div class="bar">
      <button id="cfUseLocal">使用本地版</button>
      <button id="cfUseServer">使用云端版</button>
      <button id="cfSaveBoth">另存为两个文档</button>
      <button id="cfClose">暂不处理（保留双方）</button>
    </div>
  </div>
</div>
<script src="/vendor/app.js"></script>
</body>
</html>
